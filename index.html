
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistem Perpustakaan Mini - Secure</title>

<style>

:root{
--bg-body:#f4f7f6;
--bg-container:#ffffff;
--text-main:#333;
--text-secondary:#555;
--accent-color:#007bff;
--border-color:#ddd;
--table-row-even:#f9f9f9;
--watermark-color:#888;
}

[data-theme="dark"]{
--bg-body:#1a1a1b;
--bg-container:#2d2d2e;
--text-main:#e1e1e1;
--text-secondary:#bbbbbb;
--accent-color:#3793ff;
--border-color:#444;
--table-row-even:#383839;
--watermark-color:#b3ff00;
}

body{
font-family:'Segoe UI',Tahoma;
background:var(--bg-body);
color:var(--text-main);
margin:20px;
transition:0.3s;
}

.main-watermark{
position:fixed;
top:15px;
left:20px;
font-size:14px;
font-weight:bold;
color:var(--watermark-color);
font-style:italic;
}

.theme-switch-wrapper{
position:fixed;
top:10px;
right:20px;
}

.theme-switch{
background:var(--accent-color);
color:white;
border:none;
padding:8px 12px;
border-radius:20px;
cursor:pointer;
}

.container{
max-width:900px;
margin:40px auto;
background:var(--bg-container);
padding:30px;
border-radius:12px;
box-shadow:0 4px 20px rgba(0,0,0,0.15);
}

h2{
color:var(--accent-color);
border-bottom:2px solid var(--border-color);
padding-bottom:10px;
}

form{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
margin-bottom:40px;
}

input,select,button{
padding:12px;
border:1px solid var(--border-color);
border-radius:6px;
background:var(--bg-container);
color:var(--text-main);
}

#pin{
border:2px solid #d9534f;
grid-column:span 2;
}

.btn-submit{
background:#28a745;
color:white;
border:none;
cursor:pointer;
grid-column:span 2;
font-weight:bold;
font-size:16px;
}

.btn-delete{
background:#dc3545;
color:white;
border:none;
padding:8px 12px;
cursor:pointer;
border-radius:4px;
}

table{
width:100%;
border-collapse:collapse;
}

th,td{
border:1px solid var(--border-color);
padding:12px;
text-align:left;
}

th{
background:var(--accent-color);
color:white;
}

tr:nth-child(even){
background:var(--table-row-even);
}

small{
color:var(--text-secondary);
}
.table-top-button{
    text-align: center;
    margin-bottom: 10px;
    display: flex;
    justify-content: center;
    margin-bottom: 20px;
}
.btn-reset {
    background-color: #dc3545;
    color: white;
    border: none;
    padding: 12px 18px;
    cursor: pointer;
    border-radius: 6px;
    font-weight: bold;
    transition: 0.3s;
}
.btn-reset:hover {
    background-color: #1889ed;
    transform: scale(1.05);
    box-shadow: 0 4px 10px rgba(0,0,0,0.2);
}
</style>
</head>

<body>
<div class="table-top-button">
    <button class="btn-reset" onclick="resetDataAdmin()">Reset Semua Data</button>
</div>
<div class="main-watermark">by DjydronSuan</div>

<div class="theme-switch-wrapper">
<button class="theme-switch" onclick="toggleTheme()">
<span id="themeIcon">🌙</span>
<span id="themeText">Mode Gelap</span>
</button>
</div>

<div class="container">

<h2>Manajemen Perpustakaan</h2>

<form id="loanForm">

<input type="text" id="nama" placeholder="Nama Peminjam" required>

<input type="text" id="nim" placeholder="NIM" pattern="[0-9]+" title="Nim hanya boleh angka" required>

<input type="text" id="prodi" placeholder="Program Studi" required>

<input type="text" id="dosen" placeholder="Dosen Pembimbing" required>

<select id="jenisBuku">
<option>Sains</option>
<option>Teknologi</option>
<option>Sastra</option>
<option>Sejarah</option>
<option>Matematika</option>
<option>Agama</option>
</select>

<input type="text" id="judulBuku" placeholder="Judul Buku" required>

<input type="date" id="tglPinjam" required>

<input type="date" id="tglKembali" required>

<input type="password" id="pin" placeholder="Buat PIN Keamanan untuk Mengembalikan" required>

<button type="submit" class="btn-submit">
Konfirmasi Peminjaman
</button>

</form>


<h2>Daftar Peminjam</h2>

<table id="loanTable">

<thead>
<tr>
<th>Peminjam (NIM)</th>
<th>Prodi</th>
<th>Buku</th>
<th>Keterangan</th>
<th>Aksi</th>
</tr>
</thead>

<tbody></tbody>

</table>

</div>

<script>
function resetDataAdmin(){
    const adminPin= "23456";
    const inputPin= prompt("Masukkan PIN Admin untuk reset data:");

    if(inputPin === null){
        return;
    }
    if(inputPin === adminPin){
        if(confirm("Hapus semua data peminjam?")){
            localStorage.removeItem("loans");
            displayData();
            alert("Semua data peminjam telah dihapus.");
        }
    } else {
        alert("PIN Admin salah!");
    }
}

function resetData(){
if(confirm("Hapus semua data peminjam?")){
localStorage.removeItem("loans");
displayData();
}
}
const loanForm=document.getElementById("loanForm");
const loanTable=document.getElementById("loanTable").getElementsByTagName("tbody")[0];

function toggleTheme(){

const current=document.documentElement.getAttribute("data-theme");
const target=current==="dark"?"light":"dark";

document.documentElement.setAttribute("data-theme",target);
localStorage.setItem("theme",target);
updateThemeUI(target);

}

function updateThemeUI(theme){

const icon=document.getElementById("themeIcon");
const text=document.getElementById("themeText");

if(theme==="dark"){
icon.innerText="☀️";
text.innerText="Mode Terang";
}else{
icon.innerText="🌙";
text.innerText="Mode Gelap";
}

}

window.onload=()=>{

displayData();

const savedTheme=localStorage.getItem("theme")||"light";
document.documentElement.setAttribute("data-theme",savedTheme);
updateThemeUI(savedTheme);

}

loanForm.addEventListener("submit",function(e){

e.preventDefault();

const data={
nama:document.getElementById("nama").value,
nim:document.getElementById("nim").value,
prodi:document.getElementById("prodi").value,
jenis:document.getElementById("jenisBuku").value,
judul:document.getElementById("judulBuku").value,
tglPinjam:document.getElementById("tglPinjam").value,
tglKembali:document.getElementById("tglKembali").value,
pin:document.getElementById("pin").value,
id:Date.now()
};

let loans=JSON.parse(localStorage.getItem("loans"))||[];

loans.push(data);

localStorage.setItem("loans",JSON.stringify(loans));

loanForm.reset();

displayData();

alert("Data tersimpan! Ingat PIN Anda untuk mengembalikan buku.");

});


function displayData(){

loanTable.innerHTML="";

const loans=JSON.parse(localStorage.getItem("loans"))||[];

loans.forEach(loan=>{

let row=loanTable.insertRow();

row.innerHTML=`

<td>
<strong>${loan.nama}</strong><br>
<small>${loan.nim}</small>
</td>

<td>${loan.prodi}</td>

<td>${loan.judul}</td>

<td>
<small>
Pinjam: ${loan.tglPinjam}<br>
Kembali: ${loan.tglKembali}
</small>
</td>

<td>
<button class="btn-delete" onclick="verifyAndDelete(${loan.id})">
Kembalikan
</button>
</td>

`;

});

}


function verifyAndDelete(id){

let loans=JSON.parse(localStorage.getItem("loans"));

const target=loans.find(l=>l.id===id);

const inputPin=prompt("Masukkan PIN Anda untuk mengembalikan buku:");

if(inputPin===null)return;

if(inputPin===target.pin){

loans=loans.filter(loan=>loan.id!==id);

localStorage.setItem("loans",JSON.stringify(loans));

alert("Buku berhasil dikembalikan.");

displayData();

}else{

alert("PIN SALAH! Hanya Anda yang bisa mengembalikan buku ini.");

}

}

</script>

</body>
</html>
